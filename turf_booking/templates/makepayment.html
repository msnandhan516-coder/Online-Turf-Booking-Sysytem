{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center pt-5">
        <div class="col-lg-6">
            <!-- SIMULATED AUTHORIZATION CONSOLE -->
            <div class="pro-card p-4 p-md-5 text-center w-100" style="max-width: 100%;">
                <div class="mb-5">
                    <div class="display-Font text-primary mb-3" style="font-size: 3rem;">
                        <i class="fas fa-microchip"></i>
                    </div>
                    <h4 class="text-primary uppercase tracking-widest mb-1">Authorization Mode</h4>
                    <h1 class="display-4 text-white">TEST <span class="text-primary">SIMULATOR</span></h1>
                    <div class="py-1 px-3 bg-primary text-black d-inline-block small font-weight-bold uppercase mt-2">
                        RAZORPAY BYPASSED | SECURITY OVERRIDE ACTIVE
                    </div>
                </div>

                <div class="tactical-border bg-black p-4 mb-5 text-left">
                    <div class="row">
                        <div class="col-6">
                            <label class="pro-label m-0" style="font-size: 0.6rem;">Mission Identifier</label>
                            <div class="text-white font-mono small">#BT-SIM-{{ slotid }}</div>
                        </div>
                        <div class="col-6 text-right">
                            <label class="pro-label m-0" style="font-size: 0.6rem;">Simulated Charge</label>
                            <div class="text-primary font-weight-bold h4 m-0">₹{{ amount }}</div>
                        </div>
                    </div>
                </div>

                <!-- SIMULATED CARD PORTAL -->
                <div class="text-left mb-5">
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="pro-label">Simulated Card Matrix</label>
                            <input type="text" class="pro-input" placeholder="XXXX XXXX XXXX XXXX" value="4242 4242 4242 4242" readonly>
                        </div>
                        <div class="col-6">
                            <label class="pro-label">Verification Hex</label>
                            <input type="text" class="pro-input" placeholder="CVV" value="***" readonly>
                        </div>
                        <div class="col-6">
                            <label class="pro-label">Mission Expiry</label>
                            <input type="text" class="pro-input" placeholder="MM/YY" value="12/30" readonly>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <a href="{% url 'StatusChange' slotid %}" class="pro-btn hud-glow">
                        <i class="fas fa-bolt mr-2"></i> AUTHORIZE & BYPASS PAYMENT
                    </a>
                </div>

                <p class="text-muted mt-5 small uppercase tracking-widest" style="font-size: 0.65rem;">
                    <i class="fas fa-flask mr-2"></i> Sandbox Environment Active - No Real Funds Involved
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
